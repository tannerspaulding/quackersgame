<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quackers</title>
<meta name="description" content="Quackers: explore the worlds, find the hidden ducks and fill your Duck Log. A game by Mitchell.">
<meta name="theme-color" content="#BFE6FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14314F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="brand/quackers-icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Quackers">
<meta name="application-name" content="Quackers">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Grandstander:wght@700;800;900&family=Patrick+Hand&display=swap">
<style>
/* Layout: a header, then one phone-sized game frame you can play (home screen with world cards, worlds that go full screen with arrow buttons to move between areas and corner buttons, sheets that slide up, and an Egg Guard screen), a caption under it saying what is Mitchell's idea, then a now-versus-new comparison. Pond Morning colors and fonts from the live game; the new look adds shading, thick outlines and bounce. */
:root{
  --ink:#173A5E; --duck:#FFCB2F; --pond:#2387D9; --lily:#3FB86A; --bubble:#FF6FA6; --pumpkin:#FF9F43;
  --cloud:#FFFFFF; --mist:#DCEBF7; --soft:#9DB7D2; --dim:#4F6E8C;
  --sky-top:#BFE6FF; --sky-bot:#EAF6FF; --text:#173A5E; --muted:#4F6E8C;
  --display:"Grandstander","Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,-apple-system,sans-serif;
  --note:"Patrick Hand","Comic Neue","Chalkboard SE",cursive;
  --squish:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky-top:#14314F;--sky-bot:#0D1F33;--text:#EAF4FF;--muted:#9DB7D2;color-scheme:dark}}
:root[data-theme="dark"]{--sky-top:#14314F;--sky-bot:#0D1F33;--text:#EAF4FF;--muted:#9DB7D2;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--sky-bot)}
body{margin:0;color:var(--text);font-family:var(--body);font-size:17px;line-height:1.45;
  background:linear-gradient(var(--sky-top) 0, var(--sky-bot) 520px) no-repeat, var(--sky-bot);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:14px 40px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h3{font-size:1.08rem;font-weight:900}
p{margin:0}
.muted{color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}
.who{font-family:var(--display);font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.src{font-family:var(--note);font-size:1.08rem;color:var(--dim);line-height:1.25}
:focus-visible{outline:3px solid var(--pond);outline-offset:3px}

/* ----- App frame ----- */
.app{position:relative;width:100%;max-width:520px;margin:0 auto;border:3px solid var(--ink);border-radius:26px;overflow:hidden;background:#EAF6FF;color:var(--ink);box-shadow:0 6px 0 var(--ink)}
.topbar{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;background:var(--cloud);border-bottom:3px solid var(--ink)}
.topbar h3{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.round{width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:var(--duck);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.round:active{transform:translateY(3px);box-shadow:none}
.round:disabled{visibility:hidden}
.pts{display:flex;align-items:center;gap:5px;border:3px solid var(--ink);border-radius:999px;padding:2px 10px 2px 4px;background:#FFF3C4;font-family:var(--display);font-weight:900;font-size:.95rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pts.pop{animation:pop .45s var(--squish)}

/* Home */
.home{padding:12px;display:flex;flex-direction:column;gap:12px}
.logo{display:flex;align-items:center;gap:0;justify-content:center;max-width:100%}
.logo svg{width:70px;height:62px}
.logo svg.qmark{width:64px;height:57px;flex:none;margin:0 -12px -6px 0}
.logo svg.qmark+b{position:relative;z-index:1}
.logo b{font-family:var(--display);font-size:2.3rem;font-weight:900;color:var(--duck);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;letter-spacing:.01em}
.event{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:3px solid var(--ink);border-radius:20px;background:linear-gradient(#FFE3C2,#FFC98F);padding:8px 12px;box-shadow:0 4px 0 var(--ink)}
.event:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.event svg{width:64px;height:54px;flex:none}
.event b{font-family:var(--display);display:block;font-size:1.05rem;line-height:1.1}
.event small{font-family:var(--note);font-size:1.02rem;color:#7a3c10}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;gap:0;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:var(--cloud);padding:0;text-align:left;box-shadow:0 4px 0 var(--ink)}
.wcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.wcard .thumb{aspect-ratio:4/3;border-bottom:3px solid var(--ink);position:relative}
.wcard .thumb svg{width:100%;height:100%;display:block}
.wcard .meta{padding:5px 8px 7px;display:flex;flex-direction:column;gap:1px}
.wcard .num{font-family:var(--display);font-size:.66rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.wcard b{font-family:var(--display);font-size:.98rem;line-height:1.1}
.wcard small{font-family:var(--note);font-size:.98rem;color:var(--dim);line-height:1.1}
.wcard .bar2{height:8px;border-radius:9px;background:var(--mist);border:2px solid var(--ink);overflow:hidden;margin-top:3px}
.wcard .bar2 i{display:block;height:100%;background:var(--lily)}
.wcard.off{opacity:.62}
.wcard .tag{position:absolute;top:6px;left:6px;background:var(--bubble);color:#fff;border:2px solid var(--ink);border-radius:999px;font-family:var(--display);font-weight:900;font-size:.64rem;padding:0 7px;line-height:1.6}
.wcard .tag.old{background:var(--cloud);color:var(--ink)}
.bigbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bigbtn{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;font-family:var(--display);font-weight:900;font-size:1rem;box-shadow:0 4px 0 var(--ink);text-align:left;line-height:1.1}
.bigbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.bigbtn svg{width:34px;height:34px;flex:none}
.bigbtn.shop{background:#C9F2D6}.bigbtn.games{background:#E2D8FF}

/* World stage: full screen while you play */
.app.playing{position:fixed;inset:0;overscroll-behavior:none;z-index:100;max-width:none;margin:0;border:0;border-radius:0;box-shadow:none;background:#0d1f33}
.app.playing .topbar{display:none}
#scrWorld,#scrEgg{position:absolute;inset:0}
.stage{position:absolute;inset:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:#8fd3ff}
.layer{position:absolute;inset:0;overflow:hidden}
.layer svg{position:absolute;left:0;top:0;display:block;will-change:transform}
.duck,.act,.door{cursor:pointer}
.bob{animation:boing 2.6s var(--squish) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes boing{0%,62%,100%{transform:translateY(0) scale(1,1)}70%{transform:translateY(-5px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.07,.93)}88%{transform:scale(.98,1.02)}}
.shadow{animation:shad 2.6s var(--squish) infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes shad{0%,62%,100%{transform:scale(1)}70%{transform:scale(.8)}80%{transform:scale(1.08)}}
@keyframes pop{0%{filter:brightness(1.25)}40%{transform:translateY(-3px)}}
.hud{position:absolute;left:0;right:0;top:0;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;pointer-events:none;z-index:4}
.hud>*{pointer-events:auto}
.hbtn{width:42px;height:42px;flex:none;border-radius:50%;border:2.5px solid var(--ink);background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--ink)}
.hbtn:active{transform:translateY(3px);box-shadow:none}
.hbtn svg{width:22px;height:22px}
.chip{display:flex;align-items:center;gap:6px;min-width:0;background:rgba(255,255,255,.88);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px 2px 5px;
  font-family:var(--display);font-weight:900;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.chip svg{display:block;flex:none}
.chip.pop,.badge.pop{animation:pop .45s var(--squish)}
.badge{margin-left:auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.9);color:var(--ink);border:2.5px solid var(--ink);border-radius:999px;padding:1px 9px 1px 4px;
  font-family:var(--display);font-weight:900;font-size:.82rem;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.badge:active{transform:translateY(3px);box-shadow:none}
.badge svg{display:block}
.badge .sep{width:2px;height:16px;background:var(--soft);margin:0 3px;border-radius:2px}
.corner{position:absolute;z-index:4;bottom:max(12px,env(safe-area-inset-bottom))}
.corner.bl{left:max(12px,env(safe-area-inset-left))}.corner.br{right:max(12px,env(safe-area-inset-right))}
.corner.hint{background:#FFF3C4}
.edge{position:absolute;z-index:3;width:46px;height:46px;border-radius:50%;border:2.5px solid rgba(23,58,94,.75);background:rgba(255,255,255,.62);color:var(--ink);
  display:grid;place-items:center;padding:0;box-shadow:0 3px 0 rgba(23,58,94,.55);transition:transform .1s, box-shadow .1s, background .1s;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.edge::before{content:"";position:absolute;inset:-8px}
.edge:active{box-shadow:0 1px 0 rgba(23,58,94,.55);background:rgba(255,255,255,.9)}
.edge svg{width:20px;height:20px}
.edge span{position:absolute;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:.6rem;color:var(--ink);background:rgba(255,255,255,.72);border-radius:999px;padding:0 6px;line-height:1.55;pointer-events:none}
.e-left{left:max(4px,env(safe-area-inset-left));top:var(--ey,50%);margin-top:-23px}.e-left span{top:100%;margin-top:4px;left:0}
.e-right{right:max(4px,env(safe-area-inset-right));top:var(--ey,50%);margin-top:-23px}.e-right span{top:100%;margin-top:4px;right:0}
.e-up{top:calc(max(10px,env(safe-area-inset-top)) + 54px);left:50%;margin-left:-23px}.e-up span{top:100%;margin-top:4px}
.e-down{bottom:max(14px,env(safe-area-inset-bottom));left:50%;margin-left:-23px}.e-down span{bottom:100%;margin-bottom:4px}
.e-left:active{transform:translate(-3px,3px)}.e-right:active{transform:translate(3px,3px)}.e-up:active,.e-down:active{transform:translateY(3px)}
.e-left svg{animation:nudgeL 2.4s ease-in-out infinite}.e-right svg{animation:nudgeR 2.4s ease-in-out infinite}
.e-up svg{animation:nudgeU 2.4s ease-in-out infinite}.e-down svg{animation:nudgeD 2.4s ease-in-out infinite}
@keyframes nudgeL{0%,70%,100%{transform:none}80%{transform:translateX(-4px)}}
@keyframes nudgeR{0%,70%,100%{transform:none}80%{transform:translateX(4px)}}
@keyframes nudgeU{0%,70%,100%{transform:none}80%{transform:translateY(-4px)}}
@keyframes nudgeD{0%,70%,100%{transform:none}80%{transform:translateY(4px)}}
.edge.lookhere{background:var(--duck);animation:pop .5s var(--squish) 3}
.toast{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 94px);transform:translateX(-50%);z-index:5;background:var(--ink);color:#fff;border-radius:18px;padding:7px 14px;
  font-family:var(--display);font-weight:800;font-size:.9rem;line-height:1.25;text-align:center;white-space:normal;text-wrap:balance;width:max-content;max-width:min(420px,calc(100% - 24px));pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.intro{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;background:rgba(255,255,255,.94);color:var(--ink);border:3px solid var(--ink);border-radius:22px;padding:12px 18px;
  text-align:center;box-shadow:0 5px 0 var(--ink);pointer-events:none;max-width:min(320px,calc(100% - 40px));transition:opacity .4s}
.intro b{font-family:var(--display);font-size:1.4rem;display:block;line-height:1.1}
.intro span{font-family:var(--note);font-size:1.1rem;color:var(--dim);display:block;line-height:1.2;margin-top:2px}
.intro .swipe{display:block;margin:6px auto 0;width:64px;height:28px}
.intro.off{opacity:0}
.done{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:rgba(13,31,51,.45);padding:20px}
.done>div{background:var(--cloud);color:var(--ink);border:3px solid var(--ink);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;max-width:320px}
.done svg{width:120px;height:100px}
.done .big{font-family:var(--display);font-size:1.6rem;font-weight:900;line-height:1.1}
.done .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mbtn{display:flex;align-items:center;gap:8px;border:3px solid var(--ink);border-radius:18px;padding:10px;font-family:var(--display);font-weight:900;font-size:1rem;background:#FFF3C4;box-shadow:0 4px 0 var(--ink);text-align:left;line-height:1.1;position:relative}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.mbtn svg{width:30px;height:30px;flex:none}
.mbtn.shop{background:#C9F2D6}.mbtn.games{background:#E2D8FF}.mbtn.leave{background:var(--cloud);grid-column:1/-1;justify-content:center}
.mbtn .count{position:absolute;top:-9px;right:-4px;background:var(--lily);color:#fff;border:2px solid var(--ink);border-radius:999px;font-size:.66rem;padding:0 6px;line-height:1.5}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;max-height:88%;overflow:auto;background:var(--cloud);color:var(--ink);border-top:3px solid var(--ink);
  border-radius:22px 22px 0 0;padding:10px 14px 16px;box-shadow:0 -6px 0 rgba(23,58,94,.15)}
.scrim{position:absolute;inset:0;z-index:7;background:rgba(23,58,94,.28)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--soft);margin:0 auto 8px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.x{width:40px;height:40px;flex:none;border-radius:50%;border:3px solid var(--ink);background:var(--cloud);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;padding:0}
.note{font-family:var(--note);font-size:1.05rem;color:var(--dim);line-height:1.2;margin:2px 0 8px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.card{border:3px solid var(--ink);border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:#fff}
.card.miss{border:2.5px dashed var(--soft);background:var(--mist)}
.card.final{background:#FFF3C4}
.card svg{width:72px;height:62px}
.card b{font-family:var(--display);font-size:.84rem;line-height:1.1}
.card small{font-family:var(--note);font-size:.95rem;color:var(--dim);line-height:1.1}
.tier{font-family:var(--display);font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;font-weight:900;border-radius:99px;padding:0 7px;border:2px solid var(--ink)}
.t-Easy{background:#C9F2D6}.t-Sneaky{background:#E2D8FF}.t-Tricky{background:#FFD4E5}.t-Rare{background:#C7E6FF}.t-Final{background:var(--duck)}.t-Holiday{background:#FFD3A8}.t-Special{background:#FFF3C4}
.maphead{text-align:center;max-width:380px;margin:0 auto 10px}.maphead b{color:var(--ink);font-family:var(--display)}
.mapgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:380px;margin:0 auto}
.mtile{border:3px solid var(--ink);border-radius:16px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
  background:#C9F2D6;font-family:var(--display);font-weight:900;font-size:.84rem;box-shadow:0 3px 0 var(--ink);padding:4px;line-height:1.1}
.mtile.here{background:var(--duck)}
.mtile.soon{background:var(--mist);border:2.5px dashed var(--soft);box-shadow:none;color:var(--dim);cursor:default}
.mtile small{font-family:var(--note);font-weight:400;font-size:.95rem;color:var(--dim)}
.mempty{visibility:hidden}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.hcard{border:3px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:4px;background:#fff}
.hcard.now{background:#FFF0DE;border-style:dashed;border-color:#C2560F}
.hcard svg{width:100%;height:92px;background:var(--mist);border-radius:12px}
.hcard b{font-family:var(--display);font-size:.95rem;line-height:1.1}
.hcard small{font-size:.86rem;color:var(--dim);line-height:1.25}
.hcard .mon{align-self:flex-start;font-family:var(--display);font-weight:900;font-size:.64rem;border:2px solid var(--ink);border-radius:999px;padding:0 8px;background:var(--mist)}
.hcard.now .mon{background:#FF9F43;color:#fff}
.det{display:flex;align-items:center;gap:8px;background:var(--mist);border-radius:14px;padding:6px 10px;margin-bottom:10px;font-size:.92rem}
.det svg{width:36px;height:32px;flex:none}
.shopwrap{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
@media (max-width:420px){.shopwrap{grid-template-columns:minmax(0,1fr)}}
.avatar{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--mist);border-radius:16px;padding:8px}
.avatar svg{width:100px;height:90px}
.shelf{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:8px;background:var(--mist);border-radius:14px;padding:6px 8px}
.item svg{width:36px;height:32px;flex:none}
.item .nm{flex:1;min-width:0;font-weight:700;font-size:.92rem;line-height:1.15}
.item .nm small{display:block;font-weight:400;color:var(--dim);font-size:.8rem}
.buy{border:3px solid var(--ink);border-radius:12px;padding:5px 8px;font-family:var(--display);font-weight:900;font-size:.85rem;background:var(--lily);color:#fff;min-width:66px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.buy:active{transform:translateY(3px);box-shadow:none}
.buy:disabled{background:var(--cloud);color:var(--soft);border-color:var(--soft);box-shadow:none;cursor:default}
.buy.own{background:var(--duck);color:var(--ink)}
.mgrid{display:flex;flex-direction:column;gap:10px}
.mg{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:18px;padding:8px 10px;background:#fff}
.mg svg{width:78px;height:62px;flex:none;background:var(--mist);border-radius:12px}
.mg div{flex:1;min-width:0}
.mg b{font-family:var(--display);display:block;font-size:1rem;line-height:1.1}
.mg small{display:block;font-size:.84rem;color:var(--dim);line-height:1.25}
.mg .play{border:3px solid var(--ink);border-radius:14px;background:var(--duck);font-family:var(--display);font-weight:900;padding:7px 12px;box-shadow:0 3px 0 var(--ink)}
.mg .play:active{transform:translateY(3px);box-shadow:none}
.mg .play:disabled{background:var(--mist);color:var(--dim);border-color:var(--soft);box-shadow:none}

/* Egg Guard */
#scrEgg{display:grid;place-items:center;background:linear-gradient(#9fdcff 50%,#5fb244 50%)}
.field{position:relative;width:min(100vw,calc(100dvh * 4 / 3));aspect-ratio:4/3;overflow:hidden;touch-action:manipulation;user-select:none}
.pill{display:flex;align-items:center;gap:6px;background:var(--cloud);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:2px 11px 2px 5px;font-family:var(--display);font-weight:900;font-size:.92rem;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{display:block}
.field>svg{position:absolute;inset:0;width:100%;height:100%}
.ehud{position:absolute;inset:10px 10px auto;display:flex;align-items:center;gap:6px;z-index:5;pointer-events:none}
.ehud .hbtn{pointer-events:auto;margin-right:auto}
.fox{position:absolute;z-index:2;width:19%;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;touch-action:manipulation}
.fox svg{width:100%;height:auto;display:block}
.fox.run{transition:left .45s ease-in,opacity .45s;opacity:0}
.cover{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:rgba(234,246,255,.88);color:var(--ink);text-align:center;padding:16px}
.cover>div{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:320px}
.cover .big{font-family:var(--display);font-size:1.6rem;font-weight:900;line-height:1.1}
.cover .stars{font-size:2rem;color:#F0A500;-webkit-text-stroke:1.5px var(--ink);letter-spacing:.1em}
.go{border:3px solid var(--ink);border-radius:16px;background:var(--duck);font-family:var(--display);font-weight:900;font-size:1.1rem;padding:9px 20px;box-shadow:0 4px 0 var(--ink)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.go.ghost{background:var(--cloud)}

/* Caption + compare */
@media (max-width:600px){.pair{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.lineup{grid-template-columns:repeat(3,minmax(0,1fr))}}
.foot{font-family:var(--note);font-size:1.05rem;color:var(--muted)}
.confetti{position:absolute;z-index:6;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);pointer-events:none}
@media (prefers-reduced-motion:reduce){.bob,.shadow,.chip.pop,.badge.pop,.pts.pop,.edge svg,.edge.lookhere{animation:none!important}.fox.run{transition:none}}

/* No double-tap zoom anywhere; taps stay quick. */
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* quackersgame.com additions */
.page{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.topbar h1{font-size:1.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.round.snd{background:#C7E6FF}
.home .total{margin:-6px 0 0;text-align:center;font-family:var(--display);font-weight:900;font-size:1rem;color:var(--dim)}
.wcard.locked .thumb svg{filter:grayscale(.75) brightness(.9)}
.wcard.locked{opacity:.82}
.wcard .tag{display:inline-flex;align-items:center;gap:3px}
.wcard .tag.lock{background:var(--cloud);color:var(--ink)}
.wcard .tag.complete{background:var(--lily)}
.bigbtn{position:relative;text-align:left}
.bigbtn .soonlbl{margin-left:auto;font-family:var(--note);font-weight:400;font-size:.95rem;color:var(--dim)}
.homefoot{display:flex;justify-content:center}
.linkbtn{background:none;border:0;padding:6px 10px;font-family:var(--note);font-size:1.05rem;color:var(--dim);text-decoration:underline}
.linkbtn.armed{color:#c0392b;font-weight:700}
.soonbox{display:flex;gap:12px;align-items:flex-start;padding:4px 2px}
.soonbox svg{width:44px;height:44px;flex:none}
.soonbox p{margin:0;font-family:var(--body)}
.hcard.more{justify-content:center;opacity:.8}
.card.hol svg{max-height:84px}
.foot{text-align:center;margin:4px 0 0}

/* Arrow style b: a small d-pad at the bottom, between the hint and menu buttons */
.nav-b .edge{width:42px;height:42px;margin:0;top:auto;left:auto;right:auto;bottom:auto;border-radius:12px;background:rgba(255,255,255,.8)}
.nav-b .edge span{display:none}
.nav-b .edge.off{opacity:.28;pointer-events:none;box-shadow:none}
.nav-b .e-down{left:calc(50% - 21px);bottom:max(10px,env(safe-area-inset-bottom))}
.nav-b .e-left{left:calc(50% - 67px);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 44px)}
.nav-b .e-right{left:calc(50% + 25px);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 44px)}
.nav-b .e-up{left:calc(50% - 21px);bottom:calc(max(10px,env(safe-area-inset-bottom)) + 88px)}
.nav-b .e-left:active,.nav-b .e-right:active,.nav-b .e-up:active,.nav-b .e-down:active{transform:translateY(2px)}
/* Arrow style c: one row of named buttons just above the bottom buttons */
.navbar{position:absolute;z-index:3;left:8px;right:8px;bottom:calc(max(12px,env(safe-area-inset-bottom)) + 64px);display:flex;justify-content:center;flex-wrap:wrap;gap:8px;pointer-events:none}
.nav-c .navbar .edge{position:static;margin:0;width:auto;height:40px;border-radius:999px;padding:0 12px 0 8px;display:flex;align-items:center;gap:4px;pointer-events:auto;background:rgba(255,255,255,.86)}
.nav-c .navbar .e-right{flex-direction:row-reverse;padding:0 8px 0 12px}
.nav-c .navbar .edge span{position:static;margin:0;background:none;font-size:.74rem;padding:0;line-height:1}
.nav-c .navbar .edge svg{width:18px;height:18px}
.nav-c .navbar .edge:active{transform:translateY(2px)}
/* Preview only: switch between the three styles */
#navPick{position:fixed;z-index:9;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 58px);display:flex;align-items:center;gap:4px;background:var(--ink);color:#fff;border-radius:999px;padding:4px 6px 4px 12px;font-family:var(--display);font-size:.75rem}
#navPick button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:transparent;color:#fff;font-family:var(--display);font-weight:900;font-size:.85rem}
#navPick button[aria-pressed="true"]{background:var(--duck);color:var(--ink)}

/* Side quests */
.badge.quest{margin-left:auto;background:#FFF3C4;padding:1px 9px 1px 7px}
.badge.quest+.badge{margin-left:6px}
.badge.quest .qlab{font-size:.68rem;letter-spacing:.02em;text-transform:uppercase;margin-right:2px}
.badge.quest.ready{background:#9FF0C8;animation:qglow 1.4s ease-in-out infinite}
@keyframes qglow{50%{box-shadow:0 3px 0 var(--ink),0 0 0 5px rgba(76,210,160,.45)}}
.badge.quest.pop{animation:pop .45s ease-out}
.qintro{text-align:center;font-size:1.1rem}
.qlist{display:grid;gap:10px;max-width:460px;margin:0 auto}
.qcard{display:flex;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:8px 10px}
.qcard.ready{background:#E3FBEF}
.qart{width:74px;height:74px;flex:none}
.qtxt{display:flex;flex-direction:column;gap:4px;min-width:0}
.qtxt b{font-family:var(--display);font-size:1.02rem}
.qtxt small{font-family:var(--note);font-size:1rem;line-height:1.2;color:var(--dim)}
.qbar{display:block;height:10px;border:2px solid var(--ink);border-radius:9px;background:var(--mist);overflow:hidden}
.qbar i{display:block;height:100%;background:#4cd2a0}
.qnow{font-family:var(--display);font-weight:800;font-size:.9rem}
@media (max-width:370px){.badge.quest .qlab{display:none}}

/* Mitchell, the quest-giver */
.mitchbox{display:flex;align-items:flex-end;gap:8px;max-width:460px;margin:0 auto 12px}
.mitchbox .mitch{width:96px;height:172px;flex:none;margin-bottom:-6px}
.bubble{position:relative;flex:1;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;margin-bottom:40px;box-shadow:0 4px 0 var(--ink)}
.bubble:before{content:"";position:absolute;left:-13px;bottom:18px;border:10px solid transparent;border-right:13px solid var(--ink);border-left:0}
.bubble:after{content:"";position:absolute;left:-8px;bottom:20px;border:8px solid transparent;border-right:10px solid #fff;border-left:0}
.bubble b{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:#2f9e5b}
.bubble span{font-family:var(--display);font-weight:800;font-size:1.02rem;line-height:1.25}
.hear{align-self:flex-start;display:flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;background:#C9F2D6;padding:4px 12px 4px 8px;font-family:var(--display);font-weight:900;font-size:.85rem;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.hear:active{transform:translateY(3px);box-shadow:none}
.mitch .mouth{transform-box:fill-box;transform-origin:50% 0}
.mitch.talking .mouth{animation:talk .18s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.55)}to{transform:scaleY(1.15)}}
.event svg.mitch{width:54px;height:64px}
/* On the home screen the page scrolls, so the sheet and its dimmer stay fixed on screen instead of sitting at the bottom of the long page. */
.app:not(.playing) .scrim{position:fixed}
.app:not(.playing) .sheet{position:fixed;left:0;right:0;margin:0 auto;width:min(520px,100%);max-height:85vh;max-height:85dvh}
.soundoff{font-family:var(--note);font-size:.95rem;color:var(--dim)}

/* Mini games, Pond Points shop, special ducks */
.mob{position:absolute;z-index:2;transform:translate(-50%,-50%);border:0;background:transparent;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mob svg{width:100%;height:auto;display:block;overflow:visible}
.fall{width:12%}
.fall::before{content:"";position:absolute;inset:-30%}
.fall.got{transition:left .4s ease-in,top .4s ease-in,opacity .4s;opacity:.2}
.fall.yuck{animation:yuck .45s ease-out forwards}
@keyframes yuck{to{opacity:0;transform:translate(-50%,-10%) rotate(40deg) scale(.6)}}
.spot{width:30%;z-index:1}
.spot.doze svg{filter:none}
.gull{width:17%;z-index:3;pointer-events:none;transition:left .25s ease-out,top .25s ease-out}
.gull.swoop{transition:left .22s ease-in,top .22s ease-in}
.ftext{z-index:5;font-family:var(--display);font-weight:900;color:#c0392b;font-size:1.1rem;pointer-events:none;animation:ftext .7s ease-out forwards;white-space:nowrap}
@keyframes ftext{to{opacity:0;transform:translate(-50%,-160%)}}
.cover .lvls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lvl{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:52px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:4px 6px;box-shadow:0 3px 0 var(--ink);font-family:var(--display)}
.lvl b{font-size:1.15rem;line-height:1}
.lvl.fin{background:#FFF3C4}
.lvl.lock{opacity:.5;box-shadow:none}
.lvl:active{transform:translateY(3px);box-shadow:none}
.lstars{color:#F0A500;font-size:.8rem;letter-spacing:.02em;-webkit-text-stroke:.6px var(--ink)}
.cover .stars .lstars{font-size:2rem;letter-spacing:.1em;-webkit-text-stroke:1.5px var(--ink)}
.cover .prize{font-family:var(--note);font-size:1rem;color:var(--dim)}
.cover .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover p{margin:0}
.prizeart{width:110px;height:96px}
.ppill{display:inline-flex;align-items:center;gap:5px;background:#E3F3FF;border:3px solid var(--ink);border-radius:999px;padding:2px 12px 2px 4px;font-family:var(--display);font-weight:900;font-size:1rem;box-shadow:0 3px 0 var(--ink)}
.ppill.big{font-size:1.25rem}
.ppsmall{display:flex;align-items:center;gap:3px;font-family:var(--display);font-size:.9rem;color:var(--ink)}
.ppsmall svg{width:16px!important;height:16px!important}
.bigbtn span{display:flex;flex-direction:column;line-height:1.1}
.bigbtn.special{grid-column:1/-1;background:#FFF3C4}
.go.small{font-size:.95rem;padding:6px 14px}
.shoptop{display:flex;align-items:center;gap:10px;background:var(--mist);border-radius:18px;padding:6px 10px;margin-bottom:6px}
.shoptop svg{width:76px;height:72px;flex:none}
.shoptop div{flex:1;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.shoptop small{font-family:var(--note);font-size:1rem;color:var(--dim);line-height:1.1}
.shoptop b{font-family:var(--display)}
.shopmsg{margin:4px 0 8px;padding:8px 12px;border-radius:14px;background:#C9F2D6;font-family:var(--display);font-weight:800}
.shoph{margin:12px 0 6px;font-family:var(--display);font-size:1rem}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.sitem{border:3px solid var(--ink);border-radius:18px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;background:#fff}
.sitem.on{background:#FFF3C4}
.sitem svg{width:72px;height:64px}
.sitem b{font-family:var(--display);font-size:.86rem;line-height:1.1}
.sitem small{font-family:var(--note);font-size:.95rem;color:var(--dim);line-height:1.1}
.sbuy{display:inline-flex;align-items:center;gap:3px;border:2.5px solid var(--ink);border-radius:12px;background:var(--duck);font-family:var(--display);font-weight:900;font-size:.82rem;padding:4px 8px;box-shadow:0 2px 0 var(--ink);margin-top:auto}
.sbuy svg{width:15px!important;height:15px!important}
.sbuy:disabled{background:var(--mist);color:var(--dim);border-color:var(--soft);box-shadow:none}
.sitem.got .sbuy:disabled{background:#C9F2D6;color:var(--ink);border-color:var(--ink)}
.mg .lv{margin-top:2px;font-family:var(--display);font-weight:800;color:var(--ink)!important}
.note svg{vertical-align:-4px}
.sparkle{animation:sparkle 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sparkle{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.sparkle,.fall.yuck,.ftext{animation:none!important}.gull,.fall.got{transition:none}}
.throw{width:9%;z-index:4;pointer-events:none}
.throw.fly{transition:left .55s ease-out,top .55s cubic-bezier(.2,-0.6,.6,1),opacity .55s}
#scrEgg>.cover{z-index:6;overflow:auto}
.king{display:flex;align-items:center;gap:10px;margin:4px 0 2px;padding:6px 10px;border:3px solid var(--ink);border-radius:18px;background:#FFE9EC}
.king svg{width:80px;height:78px;flex:none}
.king p{margin:0;font-size:.92rem;line-height:1.3}
.king b{font-family:var(--display)}

</style>

<body>
<svg id="defs" width="0" height="0" style="position:absolute" aria-hidden="true"></svg>
<main class="page">
    <div class="app" id="app">
      <div class="topbar">
        <button class="round" type="button" id="homeBtn" aria-label="Home"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 11 L11 4 L19 11 V19 H13 V14 H9 V19 H3 Z" fill="#fff" stroke="#173A5E" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
        <h1 id="title">Quackers</h1>
        <button class="round snd" type="button" id="sndBtn" aria-label="Sound"></button>
      </div>
      <div id="scrHome" class="home"></div>
      <div id="scrWorld" hidden>
        <div class="stage" id="stage">
          <div class="hud">
            <button class="hbtn" type="button" id="exitBtn" aria-label="Back to the worlds"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 11 L11 4 L19 11 V19 H13 V14 H9 V19 H3 Z" fill="#FFCB2F" stroke="#173A5E" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
            <span class="chip" id="areaPill"></span>
            <button class="badge quest" type="button" id="questPill" hidden></button><button class="badge" type="button" id="countPill"></button>
          </div>
          <button class="hbtn corner bl hint" type="button" id="tabHint" aria-label="Hint"><svg viewBox="0 0 26 26" aria-hidden="true"><path d="M13 3 A7 7 0 0 1 17 16 V18 H9 V16 A7 7 0 0 1 13 3 Z" fill="#FFE066" stroke="#173A5E" stroke-width="2.4" stroke-linejoin="round"/><rect x="9" y="19" width="8" height="4" rx="2" fill="#9DB7D2" stroke="#173A5E" stroke-width="2"/></svg></button>
          <button class="hbtn corner br" type="button" id="tabMenu" aria-label="Menu"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M5 7 H17 M5 11 H17 M5 15 H17" stroke="#173A5E" stroke-width="2.8" stroke-linecap="round"/></svg></button>
          <div class="toast" id="toast" role="status" aria-live="polite"></div>
          <div class="intro off" id="intro" aria-hidden="true"></div>
          <div class="done" id="done" hidden></div>
        </div>
      </div>
      <div id="scrEgg" hidden>
        <div class="field" id="field">
          <svg viewBox="0 0 400 300" id="fieldArt" aria-hidden="true"></svg>
          <div class="ehud"><button class="hbtn" type="button" id="eExit" aria-label="Leave Egg Guard"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 11 L11 4 L19 11 V19 H13 V14 H9 V19 H3 Z" fill="#FFCB2F" stroke="#173A5E" stroke-width="2.4" stroke-linejoin="round"/></svg></button><span class="pill" id="eEggs"></span><span class="pill" id="eTime"></span><span class="pill" id="eScared"></span></div>
        </div>
        <div class="cover" id="eCover"></div>
      </div>
      <div class="scrim" id="scrim" hidden></div>
      <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
    </div>
    <p class="foot">A game by Mitchell. Every character is drawn just for Quackers.</p>
</main>
<script>
const INK="#173A5E";
/* Scenery keeps a thin, light edge. Ducks and characters get none (see soften below), so hidden ducks blend in. */
const O=`stroke="${INK}" stroke-opacity=".3" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"`;
const O2=`stroke="${INK}" stroke-opacity=".26" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"`;
const N='pointer-events="none"';

/* Shading: every shape gets a soft radial or vertical gradient, registered once in #defs */
const GR=new Map(); let dirty=false;
function mix(hex,t,to){const a=parseInt(hex.slice(1),16),b=parseInt(to.slice(1),16);
  const ch=(s)=>Math.round(((a>>s)&255)+((((b>>s)&255)-((a>>s)&255))*t));
  return "#"+[16,8,0].map(s=>ch(s).toString(16).padStart(2,"0")).join("");}
function G(hex){hex=hex.toLowerCase();const id="r"+hex.slice(1);
  if(!GR.has(id)){GR.set(id,`<radialGradient id="${id}" cx="34%" cy="28%" r="80%"><stop offset="0" stop-color="${mix(hex,.5,"#ffffff")}"/><stop offset=".55" stop-color="${hex}"/><stop offset="1" stop-color="${mix(hex,.34,"#173a5e")}"/></radialGradient>`);dirty=true;}
  return `url(#${id})`;}
function LG(top,bot){top=top.toLowerCase();bot=bot.toLowerCase();const id="l"+top.slice(1)+bot.slice(1);
  if(!GR.has(id)){GR.set(id,`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient>`);dirty=true;}
  return `url(#${id})`;}
function RB(){ if(!GR.has("rainbow")){GR.set("rainbow",`<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6f91"/><stop offset=".25" stop-color="#ffcb2f"/><stop offset=".5" stop-color="#7fd04e"/><stop offset=".75" stop-color="#4fb3ff"/><stop offset="1" stop-color="#b48cff"/></linearGradient>`);dirty=true;} return "url(#rainbow)"; }
function flush(){if(dirty){document.getElementById("defs").innerHTML="<defs>"+[...GR.values()].join("")+"</defs>";dirty=false;}}
const sv=(vb,inner,extra="")=>`<svg viewBox="${vb}" aria-hidden="true" ${extra}>${inner}</svg>`;

/* ---------- Toy ducks and what they wear ---------- */
const YEL={body:"#ffcb2f",wing:"#f0a500",beak:"#ff8a3d"};
const spark=(x,y,s=1,c="#ffe066")=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="${c}" stroke="${INK}" stroke-width="1.4" stroke-linejoin="round"/>`;
const ACC={
  mail:()=>`<g transform="translate(30 -10) rotate(-8)"><rect x="0" y="-6" width="17" height="12" rx="2" fill="#ffffff" ${O2}/><path d="M0 -6 L8.5 1 L17 -6" fill="none" ${O2}/><circle cx="13" cy="2" r="2" fill="#ff6fa6"/></g>`,
  leaf:()=>`<g transform="translate(9 -33) rotate(-20)"><path d="M0 0 Q-4 -16 8 -22 Q16 -8 0 0 Z" fill="${G("#7fd04e")}" ${O2}/><path d="M1 -2 Q4 -11 7 -18" stroke="${INK}" stroke-width="1.6" fill="none"/></g>`,

function tone(f1,f2,dur,type="sine",vol=.18,when=0){ if(!S.sound) return; const c=ctx(); if(!c) return; const t=c.currentTime+when, o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(40,f2),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.02); }

const door=(to,label,inner,soon)=>`<g class="door" ${soon?`data-soon="${soon}"`:`data-door="${to}"`} tabindex="0" role="button" aria-label="${label}">${inner}</g>`;
const act=(name,label,inner)=>`<g class="act" data-act="${name}" tabindex="0" role="button" aria-label="${label}">${inner}</g>`;
const helperAt=(w,x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})" ${N}>${shadow(20)}<g class="bob">${w.helper.art(false)}</g></g>`;
/* Each new world has a helper. Every duck you find gives you one of its tokens; hand them all over and the helper becomes the last duck. */
const ICONS={fish:s=>fishIcon(s),ticket:s=>ticketIcon(s),gear:s=>gearIcon(s)};
const regDucks=w=>(w.ducks||[]).filter(d=>!d.helper);
const helperDuck=w=>(w.ducks||[]).find(d=>d.helper);
const tokensFor=w=>regDucks(w).filter(d=>S.found.has(d.id)).length;
function HELP(wid,x,y,s){ const w=WORLDS_REF(wid), hd=helperDuck(w);
  if(THUMB) return helperAt(w,x,y,s);
  if(S.found.has(hd.id)) return `<g transform="translate(${x} ${y}) scale(${s})" ${N}>${shadow(20)}<g class="bob">${w.helper.art(true)}</g></g>`;
  const got=tokensFor(w), need=regDucks(w).length;
  return act("helper",`${w.helper.name}: ${got} of ${need} ${w.helper.plural}`,`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="0" r="40" fill="transparent"/>${shadow(20)}<g class="bob">${w.helper.art(false)}</g>
    <g transform="translate(0 -52)"><rect x="-30" y="-13" width="60" height="26" rx="13" fill="${got>=need?"#4cd2a0":"#ffffff"}" stroke="${INK}" stroke-width="2.6"/><g transform="translate(-13 0)">${ICONS[w.helper.icon](.62)}</g><text x="11" y="5" text-anchor="middle" font-family="Grandstander,sans-serif" font-weight="900" font-size="13" fill="${INK}">${got}/${need}</text></g></g>`); }

  hint:"Gobble gobble",task:"Find 6 acorns in The Backyard, then search for the duck.",say:"Hey, it's Thanksgiving! Collect 6 acorns from The Backyard to get the Turkey Duck to spawn. Good luck trying to find him!",tokens:{a1:"yard",a2:"yard",a3:"garden",a4:"pond",a5:"treetop",a6:"house"},art:()=>toyTurkey()}];
const holOn=h=>!!h&&h.m===NOW_MONTH;
const holLive=h=>holOn(h)&&!S.found.has(h.id);
const holHere=()=>HOL.find(h=>h.world===S.world);
const tokAll=h=>Object.keys(h.tokens).length;
const tokGot=h=>S.tokens.filter(t=>t in h.tokens).length;
function T(id,x,y){ if(THUMB) return ""; const h=holHere(); if(!holLive(h)||!(id in h.tokens)||S.tokens.includes(id)) return "";
  return `<g class="token" data-token="${id}" tabindex="0" role="button" aria-label="Something small" transform="translate(${x} ${y})"><circle r="18" fill="transparent"/><g class="bob">${acornIcon(.9)}</g></g>`; }
function H(id,x,y,s){ const h=HOL.find(k=>k.id===id); if(THUMB||!holOn(h)||tokGot(h)<tokAll(h)) return ""; return place(id,x,y,s); }

function syncUnlock(){ let u=Math.max(1,S.unlocked|0); for(const w of WORLDS){ const next=WORLDS[w.n]; if(next&&w.n<=u&&wFound(w)>=wTotal(w)) u=Math.max(u,next.n); } u=Math.min(u,WORLDS.length); if(u!==S.unlocked){ S.unlocked=u; save(); } }
syncUnlock();

function burst(host,x,y){
  if(reduce) return;
  const r=host.getBoundingClientRect();
  for(let i=0;i<10;i++){
    const d=document.createElement("i"); d.className="confetti"; const a=i/10*Math.PI*2;
    d.style.cssText=`left:${x-r.left-5}px;top:${y-r.top-5}px;background:${["#FFCB2F","#FF6FA6","#3FB86A","#8FD0FF"][i%4]}`;

const VOICE={ok:typeof window.speechSynthesis!=="undefined"&&typeof window.SpeechSynthesisUtterance!=="undefined",v:null,unlocked:false};
function pickVoice(){ if(!VOICE.ok) return null; const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_|$)/i.test(v.lang)); if(!vs.length) return null;
  const pref=["Samantha","Google US English","Microsoft Aria","Microsoft Jenny","Microsoft Guy","Alex","Karen","Daniel"];
  for(const n of pref){ const v=vs.find(v=>v.name.includes(n)); if(v) return v; }
  return vs.find(v=>/en-US/i.test(v.lang))||vs[0]; }

const CLIPS={};
let clipAu=null;
function say(text,id){ if(!S.sound) return false; hush();
  if(id&&CLIPS[id]){ try{ const a=clipAu=new Audio(CLIPS[id]); a.onended=()=>talking(false); a.onerror=()=>{ if(clipAu===a){ clipAu=null; speak(text); } };

  return speak(text); }
function speak(text){ if(!VOICE.ok||!S.sound) return false;

const CAM={s:1,W:400,H:300,x:0,y:0,minX:0,maxX:0,minY:0,maxY:0};
function vp(){ return {w:stage.clientWidth||innerWidth||400, h:stage.clientHeight||innerHeight||300}; }

/* The whole scene always fits on screen, centered. No scrolling and no zoom: the arrows move you. */
function fit(){
  const {w,h}=vp(); const s=Math.min(w/400,h/300); CAM.s=s; CAM.W=400*s; CAM.H=300*s;
  CAM.minX=CAM.maxX=(w-CAM.W)/2; CAM.minY=CAM.maxY=(h-CAM.H)/2;
  /* Side arrows sit in the open ground under the picture when the screen has room, so they cover nothing. */
  const sb=CAM.minY+CAM.H, room=h-80-sb; stage.style.setProperty("--ey",room>=70?Math.round(sb+room/2)+"px":"50%");
}

/* The svg fills the stage. Its viewBox shows the whole 400 x 300 scene and simply opens up past the edges,

function paint(el=layer()){ if(!el) return; const svg=el.querySelector("svg"); if(!svg) return;
  const {w,h}=vp(), s=CAM.s||Math.min(w/400,h/300), vw=w/s, vh=h/s;
  svg.setAttribute("viewBox",`${((400-vw)/2).toFixed(2)} ${((300-vh)/2).toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}`);
  svg.style.width=w+"px"; svg.style.height=h+"px"; svg.style.transform="none"; }

function openShop(msg){
  const sec=(k,title)=>`<h4 class="shoph">${title}</h4><div class="shopgrid">${SHOP.filter(i=>i.kind===k).map(i=>{
    const got=i.kind!=="hint"&&own(i.id), on=(i.kind==="hat"&&S.hat===i.acc)||(i.kind==="color"&&S.color===i.color), afford=S.pts>=i.cost;
    const lab=i.kind==="hint"?(afford?"Buy":"Need more"):got?(i.kind==="duck"?"Yours!":on?"Take off":"Wear"):afford?"Buy":"Need more";

      ${i.kind==="hint"?`<small>You have ${S.spark}</small>`:""}<button type="button" class="sbuy" data-shop="${i.id}"${(!got&&!afford)||(got&&i.kind==="duck")?" disabled":""}>${got?"":`${PP}${i.cost} `}${lab}</button></div>`;}).join("")}</div>`;

function buy(id){ const i=SHOP.find(x=>x.id===id); if(!i) return;
  if(i.kind==="hat"&&own(id)){ S.hat=S.hat===i.acc?"":i.acc; save(); pop(); openShop(S.hat?`Your duck is wearing the ${i.name}.`:"Hat off!"); return; }
  if(i.kind==="color"&&own(id)){ S.color=S.color===i.color?"":i.color; save(); pop(); openShop(S.color?`Your duck is ${i.color} now.`:"Back to yellow!"); return; }
  if(i.kind==="duck"&&own(id)) return;
  if(S.pts<i.cost){ blip(); openShop(`You need ${i.cost-S.pts} more Pond Points for that.`); return; }
  S.pts-=i.cost;
  if(i.kind==="hint") S.spark++; else S.own.push(id);
  if(i.kind==="hat") S.hat=i.acc;
  if(i.kind==="color") S.color=i.color;
  save(); fanfare(); refreshHome();
  openShop(i.boss?"Kingsley joins your special ducks! Long live the king!":i.kind==="duck"?`The ${i.name} joins your special ducks!`:i.kind==="hat"?`Your duck is wearing the ${i.name}!`:i.kind==="color"?`Your duck is ${i.color} now!`:`You have ${S.spark} Duck Sparkle${S.spark>1?"s":""}. Use one with the light bulb in a world.`);
}

   .concat(SHOP.filter(i=>i.kind==="duck").map(i=>{ const got=own(i.id);
    return `<div class="card${got?"":" miss"}"><svg viewBox="-44 -52 88 82" aria-hidden="true">${got?shopArt(i):`<g opacity=".35">${i.art?i.art():toyDuck(GHOST)}</g>`}</svg><span class="tier t-Rare">Shop</span>${got?`<b>${i.name}</b>`:`<small>${i.boss?"1,000 Pond Points":"In the shop"}</small>`}</div>`; })).join("");
  const n=MINI.filter(starWon).length+SHOP.filter(i=>i.kind==="duck"&&own(i.id)).length, t=MINI.length+Object.keys(SHOPDUCK).length;

}

   :`<path d="M-10 -26 Q-7 -23 -4 -26 M4 -26 Q7 -23 10 -26" fill="none" stroke="#1a1a1a" stroke-width="2.4" stroke-linecap="round"/>`;
  const zz=mode==="doze"?`<text x="18" y="-46" font-family="Grandstander,sans-serif" font-weight="900" font-size="13" fill="${INK}">z</text><text x="26" y="-56" font-family="Grandstander,sans-serif" font-weight="900" font-size="10" fill="${INK}">z</text>`:"";
  return `<g transform="translate(-26 -8)"><ellipse cx="0" cy="8" rx="20" ry="15" fill="${G("#a8743f")}" ${O}/><ellipse cx="0" cy="12" rx="11" ry="8" fill="#e0b98a"/>
   <circle cx="-13" cy="-38" r="6" fill="${G("#a8743f")}" ${O2}/><circle cx="13" cy="-38" r="6" fill="${G("#a8743f")}" ${O2}/>
   <circle cx="0" cy="-24" r="16" fill="${G("#a8743f")}" ${O}/><ellipse cx="0" cy="-18" rx="7" ry="5" fill="#e0b98a"/><ellipse cx="0" cy="-20" rx="2.6" ry="1.8" fill="#1a1a1a"/>
   ${eyes}<g transform="translate(0 -38)"><ellipse cx="0" cy="0" rx="20" ry="4.5" fill="${G(hat)}" ${O2}/><path d="M-10 0 Q-10 -12 0 -12 Q10 -12 10 0 Z" fill="${G(hat)}" ${O2}/></g>${zz}</g>`; }
function drawSpot(s){ const hat=["#ff6f91","#4fb3ff","#7fd04e"][s.i];
  s.b.classList.toggle("doze",s.mode!=="watch");
  s.b.querySelector("svg").innerHTML=`<ellipse cx="4" cy="14" rx="54" ry="15" fill="${G(["#ff9ec7","#9fd8ff","#b8ec8e"][s.i])}" ${O}/><path d="M-40 6 L48 22 M-30 24 L30 4" stroke="#fff" stroke-width="3" opacity=".6"/>
   ${bear(s.mode,hat)}${s.has&&s.hey<=0?`<g transform="translate(20 8) scale(1.3)">${sandIcon()}</g>`:`<g transform="translate(20 6)"><rect x="-12" y="-8" width="24" height="16" rx="4" fill="${G("#c89260")}" ${O2}/><path d="M-12 -2 H12" stroke="${INK}" stroke-opacity=".4" stroke-width="1.6"/></g>`}
   ${s.hey>0?`<g transform="translate(-8 -58)"><rect x="-18" y="-12" width="36" height="20" rx="10" fill="#fff" stroke="${INK}" stroke-width="2"/><text x="0" y="3" text-anchor="middle" font-family="Grandstander,sans-serif" font-weight="900" font-size="12" fill="${INK}">Hey!</text></g>`:""}`;
  flush(); }
/* The picnic bear jumps up and throws a basket or some trash after Mr. Seagull. It always misses. */
function throwAt(s,miss){ const things=[`<g transform="scale(1.2)"><path d="M-12 -2 H12 L9 10 H-9 Z" fill="${G("#c89260")}" ${O2}/><path d="M-12 -2 Q0 -14 12 -2" fill="none" stroke="#8a5a33" stroke-width="2.4"/><path d="M-11 2 H11" stroke="#d8344f" stroke-width="2"/></g>`,
  `<g transform="rotate(20)"><path d="M-6 -12 H6 L8 12 H-8 Z" fill="${G("#7fd04e")}" ${O2}/><rect x="-4" y="-16" width="8" height="5" rx="1" fill="#e8e8e8" stroke="${INK}" stroke-width="1"/></g>`,
  JUNK[0].art(),`<path d="M-9 -6 Q0 -12 9 -6 L7 8 Q0 11 -7 8 Z" fill="${G("#e0e6ee")}" ${O2}/>`];
  const x0=[20,50,80][s.i], y0=[64,76,64][s.i], o=mob("throw","-18 -18 36 36",things[Math.floor(Math.random()*things.length)],"",()=>{}); o.tabIndex=-1; o.setAttribute("aria-hidden","true");
  place2(o,x0,y0); void o.offsetWidth; o.classList.add("fly"); setTimeout(()=>place2(o,miss?x0+(Math.random()<.5?-14:14):14+Math.random()*10,miss?y0-30:18),20); setTimeout(()=>o.remove(),700);
  if(miss) floatText(x0,y0-22,"Bonk!"); }
function snatch(s){ if(!R.run) return;
  if(!s.has||s.hey>0){ blip(); return; }
  if(s.mode==="watch"){ s.hey=1.6; s.has=true; s.t=Math.max(s.t,1.6); blip("door"); drawSpot(s); throwAt(s,true); return; }
  s.has=false; s.re=.7; R.score++; pop(); s.mode="watch"; s.t=(1.5+Math.random()*1.2)*(1+(R.L-1)*.04); s.hey=.9; drawSpot(s); throwAt(s);
  const g=R.gull; g.classList.add("swoop"); place2(g,[20,50,80][s.i],[64,76,64][s.i]); clearTimeout(g._t); g._t=setTimeout(()=>{ g.classList.remove("swoop"); place2(g,14,24); },260); }

/* The shared mini game screen. */
function drawField(){ $("fieldArt").innerHTML=R.g.art(); flush(); }
function openGames(){
  openSheet(`<p class="note">${PP} You have ${ppText(S.pts)}. Earn more with stars, and beat level ${LV} to win the star character.</p><div class="mgrid">${MINI.map(m=>{ const st=mgOf(m.id), won=starWon(m);
    return `<div class="mg"><svg viewBox="-44 -40 88 70" aria-hidden="true"><g class="bob">${m.a()}</g></svg><div><b>${m.n}</b><small>${m.d}</small>
      <small class="lv">${won?`${m.star} is yours!`:`Level ${Math.min(st.lvl,LV)} of ${LV}. Win ${m.star} at level ${LV}.`}</small></div>
    <button type="button" class="play" data-mini="${m.id}">Play</button></div>`;}).join("")}</div>`,"Mini games");
  $("sheet").querySelectorAll("[data-mini]").forEach(b=>b.addEventListener("click",()=>openMini(b.dataset.mini)));
}
function openEgg(){ openMini("egg"); }
function openMini(id){ const g=MG_BY[id]; if(!g) return;
  if(S.screen!=="egg") R.back=S.screen==="world"?"world":"home";
  setScreen("egg"); $("title").textContent=g.n; R.g=g; R.score=0; R.over=false; R.L=Math.min(mgOf(id).lvl,LV); g.setup(R.L); drawField(); g.hud();
  $("eExit").setAttribute("aria-label",`Leave ${g.n}`); levelPick(); }
function levelPick(){ const g=R.g, st=mgOf(g.id), c=$("eCover");
  c.innerHTML=`<div><div class="big">${g.n}</div><p>${g.how}</p>
   <div class="lvls">${Array.from({length:LV},(_,i)=>{ const L=i+1, open=L<=st.lvl, s=st.stars[L]|0;
     return `<button type="button" class="lvl${open?"":" lock"}${L===LV?" fin":""}" data-lvl="${L}"${open?"":" disabled"} aria-label="Level ${L}${open?`, ${s} stars`:", locked"}"><b>${L}</b>${open?starRow(s):lockSvg}</button>`;}).join("")}</div>
   <small class="prize">${starWon(g)?`You won ${g.star}!`:`Beat level ${LV} to win ${g.star}.`}</small>
   <span class="row"><button class="go" id="ePlay" type="button">Play level ${Math.min(st.lvl,LV)}</button><button class="go ghost" id="eLeave" type="button">Back</button></span></div>`;
  c.hidden=false;
  $("ePlay").addEventListener("click",()=>startMini(Math.min(st.lvl,LV)));
  $("eLeave").addEventListener("click",leaveEgg);
  c.querySelectorAll("[data-lvl]").forEach(b=>b.addEventListener("click",()=>startMini(+b.dataset.lvl))); }
function startMini(L){ const g=R.g; stopMini();
  Object.assign(R,{L,score:0,over:false,run:true,last:performance.now()}); g.setup(L); drawField(); g.hud();
  $("eCover").innerHTML=`<div><div class="big">Level ${L}</div><p>${g.goal(L)}</p></div>`; $("eCover").classList.add("brief");
  blip(); setTimeout(()=>{ if(R.run&&R.g===g&&R.L===L){ $("eCover").hidden=true; $("eCover").classList.remove("brief"); R.last=performance.now(); R.raf=requestAnimationFrame(mLoop); } },900); }
function mLoop(now){ if(!R.run) return;
  const dt=Math.min(.05,(now-R.last)/1000); R.last=now; R.left-=dt; R.g.tick(dt); R.g.hud();
  if(R.over||R.left<=0){ endMini(); return; }
  R.raf=requestAnimationFrame(mLoop); }
function leaveEgg(){ if(R.back==="world"&&S.world) enterWorld(S.world); else goHome(); }
$("eExit").addEventListener("click",leaveEgg);
/* Points: each star is worth more on higher levels, with a bonus the first time you beat a level and a big one for the last level. */
function endMini(){ const g=R.g, L=R.L, st=mgOf(g.id); stopMini();
  const s=g.stars(), old=st.stars[L]|0, first=s>0&&old===0, wonNow=first&&L===LV;
  let pts=s*(4+L)+(first?10:0)+(wonNow?25:0);
  if(s>old) st.stars[L]=s;
  if(s>0&&L>=st.lvl&&L<LV) st.lvl=L+1;
  S.pts+=pts; save(); if(s) fanfare(); else blip("door");
  const c=$("eCover"), next=s>0&&L<LV;
  c.innerHTML=`<div><div class="big">${wonNow?`You won ${g.star}!`:s?`Level ${L} done!`:"So close!"}</div>
   ${wonNow?`<svg class="prizeart" viewBox="-44 -46 88 76" aria-hidden="true"><g class="bob">${g.a()}</g></svg>`:""}
   <div class="stars">${starRow(s)}</div>
   <p>${g.result(s)}${wonNow?` ${g.star} joins your special ducks.${g.reward?" "+g.reward:""}`:""}</p>
   ${pts?`<span class="ppill big">${PP}+${pts}</span>`:""}
   <span class="row">${next?`<button class="go" id="eNext" type="button">Level ${L+1}</button>`:""}<button class="go${next?" ghost":""}" id="eAgain" type="button">Play again</button><button class="go ghost" id="eBack" type="button">Done</button></span>
   <button type="button" class="linkbtn" id="eLevels">All levels</button></div>`;
  c.hidden=false;
  if(next) $("eNext").addEventListener("click",()=>startMini(L+1));
  $("eAgain").addEventListener("click",()=>startMini(L));
  $("eBack").addEventListener("click",leaveEgg);
  $("eLevels").addEventListener("click",levelPick); }


renderSound(); goHome();
setNav(NAV);
if(PREVIEW){ const pk=document.createElement("div"); pk.id="navPick"; pk.setAttribute("role","group"); pk.setAttribute("aria-label","Arrow style");
  pk.innerHTML=`<b>Arrows</b>${["a","b","c"].map(n=>`<button type="button" data-nav="${n}">${n.toUpperCase()}</button>`).join("")}`;
  document.body.appendChild(pk); pk.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setNav(b.dataset.nav); }); setNav(NAV);
  if(S.screen!=="world") enterWorld("yard"); }
window.QUACKERS={CLIPS,say,hush,VOICE,openHolidayQuest,openQuests,quests,WORLDS,HOL,DUCK,S,month:NOW_MONTH,enterWorld,show,goHome,doAct,setNav,R,MINI,SHOP,openMini,startMini,endMini,openShop,openSpecial,buy,openGames,hint};

</script>
